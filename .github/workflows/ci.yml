name: CI
on:
  pull_request:          # run on every pull request
  push:
    branches: [main]
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                     # caches downloaded packages between runs
      - run: pip install -r requirements.txt ruff pytest
      - run: ruff check .                # lint
      - run: pytest -q                   # tests
